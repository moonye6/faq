name: schemaguardian self-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Vercel preview deployment
        if: github.event_name == 'pull_request'
        id: preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300

      - name: Resolve check URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=${{ steps.preview.outputs.url }}" >> "$GITHUB_OUTPUT"
            echo "Checking preview URL: ${{ steps.preview.outputs.url }}"
          else
            # Production push: faqjsonld.com is the live domain. Vercel takes
            # ~30-60s to roll out after merge — sleep then check.
            sleep 60
            echo "url=https://faqjsonld.com" >> "$GITHUB_OUTPUT"
            echo "Checking production URL: https://faqjsonld.com"
          fi

      - name: Run schemaguardian against critical pages
        run: |
          set -e
          BASE="${{ steps.url.outputs.url }}"
          BASE="${BASE%/}"
          PAGES=(
            ""
            "/cli"
            "/faq-schema-generator"
            "/howto-schema-generator"
            "/product-schema-generator"
            "/recipe-schema-generator"
            "/breadcrumb-schema-generator"
            "/job-posting-schema-generator"
          )
          for p in "${PAGES[@]}"; do
            URL="$BASE$p"
            echo ""
            echo "::group::schemaguardian check $URL"
            npx --yes @moonye/schemaguardian@latest check "$URL" --ci --no-color
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✓ All checked pages have valid JSON-LD schema."
          else
            echo "✗ One or more pages have invalid schema. See logs above."
          fi
